<!doctype html><html><head><meta charset="utf-8"><title>model viewer</title>
<style>html,body{margin:0;background:#6d7f99;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas>
<script src="../data/models.js"></script>
<script>
// Offline look-dev viewer for sculpted models: ?m=hero&yaw=0.5&pitch=0.1&dist=3&ty=1.2
const Q = new URLSearchParams(location.search), cv = document.getElementById('c'), gl = cv.getContext('webgl', { antialias: true });
async function decode(b64) { const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); const ds = new DecompressionStream('gzip'); const buf = await new Response(new Blob([bin]).stream().pipeThrough(ds)).arrayBuffer();
  const dv = new DataView(buf); let q = 0; const nv = dv.getUint32(q, true), ni = dv.getUint32(q + 4, true); q = 8; const lo = [], sc = []; for (let a = 0; a < 3; a++) { lo.push(dv.getFloat32(q, true)); q += 4; } for (let a = 0; a < 3; a++) { sc.push(dv.getFloat32(q, true)); q += 4; }
  const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), C = new Float32Array(nv * 3), M = new Float32Array(nv * 4), J = new Float32Array(nv * 4), W = new Float32Array(nv * 4);
  for (let i = 0; i < nv * 3; i++) { P[i] = lo[i % 3] + dv.getUint16(q, true) * sc[i % 3]; q += 2; } for (let i = 0; i < nv * 3; i++) N[i] = dv.getInt8(q++) / 127; for (let i = 0; i < nv * 3; i++) C[i] = dv.getUint8(q++) / 255 * 1.6;
  for (let i = 0; i < nv * 4; i++) M[i] = dv.getUint8(q++) / 255; for (let i = 0; i < nv * 4; i++) J[i] = dv.getUint8(q++); for (let i = 0; i < nv * 4; i++) W[i] = dv.getUint8(q++) / 255;
  const I = new Uint16Array(ni); for (let i = 0; i < ni; i++) { I[i] = dv.getUint16(q, true); q += 2; } return { nv, P, N, C, M, J, W, I }; }
const VS = `attribute vec3 aP,aN,aC;attribute vec4 aM;uniform mat4 uVP;varying vec3 vW,vN,vC;varying vec4 vM;void main(){vW=aP;vN=aN;vC=aC;vM=aM;gl_Position=uVP*vec4(aP,1.0);}`;
const FS = `precision mediump float;uniform vec3 uL,uCam,uSun,uEm,uTintM;uniform float uShow;varying vec3 vW,vN,vC;varying vec4 vM;
void main(){vec3 base=vC*mix(vec3(1.0),uTintM,vM.w);vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;float d=dot(n,uL);
float lit=mix(clamp((d+0.3)/1.3,0.0,1.0),smoothstep(0.0,0.2,d),0.55);float hemi=n.y*0.5+0.5;vec3 amb=mix(vec3(0.3,0.26,0.24),vec3(0.52,0.58,0.74),hemi);
float gloss=vM.x,metal=vM.y,em=vM.z;vec3 v=normalize(uCam-vW),h=normalize(uL+v);
vec3 diff=base*(amb*0.6+uSun*lit)*(1.0-metal*0.4);float sp=pow(max(dot(n,h),0.0),mix(6.0,90.0,gloss))*gloss*1.7*lit;
vec3 spc=mix(vec3(0.06),base*2.4+0.06,metal)*sp*uSun;vec3 r=reflect(-v,n);float ek=clamp(r.y*0.5+0.5,0.0,1.0);
vec3 env=mix(vec3(0.1,0.09,0.08),vec3(0.62,0.68,0.85),ek)*metal*(0.15+gloss*0.5)*(base*1.8+0.06);float rim=pow(1.0-max(dot(n,v),0.0),3.0);
vec3 c=diff+spc+env+vec3(0.25,0.32,0.5)*rim*0.22;c=mix(c,base*1.3+uEm*0.4,em);
if(uShow>1.5)c=n*0.5+0.5;else if(uShow>0.5)c=vC;gl_FragColor=vec4(c,1.0);}`;
const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
function persp(f, a, n, fa) { const t = 1 / Math.tan(f / 2), o = new Float32Array(16); o[0] = t / a; o[5] = t; o[10] = (fa + n) / (n - fa); o[11] = -1; o[14] = 2 * fa * n / (n - fa); return o; }
function look(e, t) { const f = nrm([t[0] - e[0], t[1] - e[1], t[2] - e[2]]), r = nrm(cr(f, [0, 1, 0])), u = cr(r, f), o = new Float32Array(16); o[0] = r[0]; o[4] = r[1]; o[8] = r[2]; o[1] = u[0]; o[5] = u[1]; o[9] = u[2]; o[2] = -f[0]; o[6] = -f[1]; o[10] = -f[2]; o[12] = -(r[0] * e[0] + r[1] * e[1] + r[2] * e[2]); o[13] = -(u[0] * e[0] + u[1] * e[1] + u[2] * e[2]); o[14] = f[0] * e[0] + f[1] * e[1] + f[2] * e[2]; o[15] = 1; return o; }
const nrm = (a) => { const l = Math.hypot(...a); return a.map((x) => x / l); }, cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
function mm(a, b) { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3]; return o; }
(async () => { const ms = await Promise.all((Q.get('m') || 'hero').split(' ').join('+').split('+').map((k) => decode(MODELS[k]))); // m=hero+armwolf draws several models together
  const cat = (k, T) => { const o = new T(ms.reduce((a, q) => a + q[k].length, 0)); let at = 0; for (const q of ms) { o.set(q[k], at); at += q[k].length; } return o; };
  const m = { nv: ms.reduce((a, q) => a + q.nv, 0), P: cat('P', Float32Array), N: cat('N', Float32Array), C: cat('C', Float32Array), M: cat('M', Float32Array), I: new Uint16Array(ms.reduce((a, q) => a + q.I.length, 0)) };
  { let at = 0, base = 0; for (const q of ms) { for (let i = 0; i < q.I.length; i++) m.I[at + i] = q.I[i] + base; at += q.I.length; base += q.nv; } } cv.width = innerWidth; cv.height = innerHeight; gl.viewport(0, 0, cv.width, cv.height);
  const buf = (d, loc, n) => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, d, gl.STATIC_DRAW); const l = gl.getAttribLocation(pr, loc); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, n, gl.FLOAT, false, 0, 0); };
  buf(m.P, 'aP', 3); buf(m.N, 'aN', 3); buf(m.C, 'aC', 3); buf(m.M, 'aM', 4); const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.I, gl.STATIC_DRAW);
  const yaw = +(Q.get('yaw') || 0.5), pitch = +(Q.get('pitch') || 0.12), dist = +(Q.get('dist') || 3.2), ty = +(Q.get('ty') || 1.1), tx = +(Q.get('tx') || 0), tz = +(Q.get('tz') || 0);
  const eye = [tx + Math.sin(yaw) * Math.cos(pitch) * dist, ty + Math.sin(pitch) * dist, tz + Math.cos(yaw) * Math.cos(pitch) * dist];
  const VP = mm(persp(+(Q.get('fov') || 0.6), cv.width / cv.height, 0.05, 50), look(eye, [tx, ty, tz]));
  const u = (n) => gl.getUniformLocation(pr, n); gl.uniformMatrix4fv(u('uVP'), false, VP); gl.uniform3fv(u('uL'), nrm([0.5, 0.75, 0.6])); gl.uniform3fv(u('uCam'), eye); gl.uniform3fv(u('uSun'), [1.05, 1.0, 0.92]);
  gl.uniform3fv(u('uEm'), [1, 0.3, 0.1]); gl.uniform3fv(u('uTintM'), [1, 1, 1]); gl.uniform1f(u('uShow'), +(Q.get('show') || 0));
  gl.enable(gl.DEPTH_TEST); gl.clearColor(0.43, 0.5, 0.6, 1); gl.clear(16640); gl.drawElements(gl.TRIANGLES, m.I.length, gl.UNSIGNED_SHORT, 0); window.done = { nv: m.nv, tris: m.I.length / 3 }; })().catch((e) => { window.done = { err: String(e) }; });
</script></body></html>
